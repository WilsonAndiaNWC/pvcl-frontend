<div class="min-h-screen flex bg-gray-50 font-sans">
  <app-sidebar></app-sidebar>

  <main class="flex-1 p-8 overflow-y-auto flex justify-center items-start">

    <div class="w-full max-w-5xl">

      <header class="flex justify-between items-center mb-10">
        <div>
          <div class="flex items-center text-gray-400 text-xs font-bold uppercase tracking-widest mb-1">
            <span>Parametría</span>
            <svg class="w-3 h-3 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
            <span class="text-primary">Infraestructura</span>
          </div>
          <h2 class="text-3xl font-extrabold text-gray-800">Mapa de Despacho</h2>
        </div>
        <button
          class="bg-primary text-white px-6 py-2.5 rounded-xl font-bold shadow-lg hover:brightness-125 transition text-sm flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
          Nueva Isla
        </button>
      </header>

      <div class="flex flex-col space-y-8">

        <div class="w-full bg-white p-8 rounded-3xl shadow-sm border border-gray-200 relative overflow-hidden">
          <div class="absolute top-0 left-0 w-2 h-full bg-primary"></div>

          <div class="flex justify-between items-start mb-8">
            <div>
              <h3 class="text-xl font-black text-gray-800 italic tracking-tighter">ISLA DE DESPACHO "A"</h3>
              <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">(Tabla: islas)</p>
            </div>
            <button
              class="text-xs font-bold text-primary border border-primary/20 bg-primary/5 px-3 py-1 rounded-lg hover:bg-primary hover:text-white transition">+
              Estación de servicio</button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div class="p-6 bg-gray-50 rounded-2xl border border-gray-100 relative group">
              <div class="flex justify-between items-center mb-4">
                <span class="text-sm font-black text-gray-700">Estación de servicio ES-01 </span>
                <span class="text-[10px] font-mono text-gray-400 uppercase tracking-tighter">(Tabla:
                  estacion_servicio)</span>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
                  <div>
                    <p class="text-[9px] font-black text-gray-400 uppercase">Manguera 1</p>
                    <p class="text-xs font-bold text-gray-800">GASOLINA ESPECIAL</p>
                  </div>
                  <div class="w-2 h-2 rounded-full bg-primary"></div>
                </div>
                <div class="bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
                  <div>
                    <p class="text-[9px] font-black text-gray-400 uppercase">Manguera 2</p>
                    <p class="text-xs font-bold text-gray-800">DIÉSEL OÍL</p>
                  </div>
                  <div class="w-2 h-2 rounded-full bg-inverse"></div>
                </div>
              </div>
              <p class="text-[9px] text-gray-400 font-bold mt-3 uppercase text-right tracking-widest">(Tabla: mangueras)
              </p>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>
</div>
