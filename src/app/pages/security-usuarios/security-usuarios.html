<div class="min-h-screen flex bg-gray-50 font-sans">
  <app-sidebar></app-sidebar>

  <main class="flex-1 p-8 overflow-y-auto flex justify-center items-start">
    <div class="w-full max-w-5xl">

      <header class="flex justify-between items-center mb-8">
        <div>
          <div class="flex items-center text-gray-400 text-xs font-bold uppercase tracking-widest mb-1">
            <span>Seguridad</span>
            <svg class="w-3 h-3 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
            <span class="text-primary">Usuarios</span>
          </div>
          <h2 class="text-3xl font-extrabold text-gray-800">Gestión de Personal</h2>
        </div>
        <button
          class="bg-primary text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-opacity-90 transition flex items-center">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
          Nuevo Usuario
        </button>
      </header>

      <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
          <h3 class="text-lg font-bold text-gray-800">Usuarios Activos del Sistema</h3>
          <span
            class="text-[10px] font-bold text-primary bg-blue-50 px-3 py-1 rounded-full border border-blue-100 uppercase tracking-widest">Tabla:
            usuarios</span>
        </div>

        <div class="overflow-x-auto p-2">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="text-gray-400 text-xs uppercase tracking-widest border-b border-gray-100">
                <th class="py-4 px-6 font-black">Nombre Completo</th>
                <th class="py-4 px-6 font-black">Username</th>
                <th class="py-4 px-6 font-black">Perfil / Permisos</th>
                <th class="py-4 px-6 font-black">Estado</th>
                <th class="py-4 px-6 font-black text-right">Acción</th>
              </tr>
            </thead>
            <tbody class="text-sm divide-y divide-gray-50">
              <tr class="hover:bg-gray-50 transition group">
                <td class="py-5 px-6 font-bold text-gray-800">Juan Perez</td>
                <td class="py-5 px-6 text-gray-500 font-mono">jperez</td>
                <td class="py-5 px-6">
                  <span class="bg-gray-100 text-gray-700 font-bold px-2 py-1 rounded text-xs mr-2">ISLERO</span>
                </td>
                <td class="py-5 px-6"><span class="text-success font-bold flex items-center"><span
                      class="w-2 h-2 bg-success rounded-full mr-2"></span>Activo</span></td>
                <td class="py-5 px-6 text-right"><button
                    class="text-primary font-bold hover:underline opacity-0 group-hover:opacity-100 transition">Editar</button>
                </td>
              </tr>
              <tr class="hover:bg-gray-50 transition group">
                <td class="py-5 px-6 font-bold text-gray-800">Maria Administrador</td>
                <td class="py-5 px-6 text-gray-500 font-mono">madmin</td>
                <td class="py-5 px-6">
                  <span class="bg-primary/10 text-primary font-bold px-2 py-1 rounded text-xs mr-2">ADMIN</span>
                </td>
                <td class="py-5 px-6"><span class="text-success font-bold flex items-center"><span
                      class="w-2 h-2 bg-success rounded-full mr-2"></span>Activo</span></td>
                <td class="py-5 px-6 text-right"><button
                    class="text-primary font-bold hover:underline opacity-0 group-hover:opacity-100 transition">Editar</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>
